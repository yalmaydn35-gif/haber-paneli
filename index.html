<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haber Paneli</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --yuzey:#F7F9FB; --murekkep:#18202C; --soluk:#5E6A7D;
  --cizgi:#D3DAE3; --vurgu:#1F55D6; --yeni:#FFF1B8; --hata:#C2412D;
  --font:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121820; --yuzey:#19212B; --murekkep:#E6EBF1; --soluk:#93A0B2;
    --cizgi:#2A3542; --vurgu:#86A6FF; --yeni:#3A3418; --hata:#F08A72;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--murekkep);font-family:var(--font);
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:4px}

.duzen{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}

/* --- Kenar çubuğu --- */
aside{background:var(--yuzey);border-right:1px solid var(--cizgi);padding:28px 20px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.durum{color:var(--soluk);font-size:.875rem;margin:0 0 20px;min-height:2.6em}
.durum .nokta{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#2FA36B;margin-right:6px;vertical-align:1px}
.durum.taraniyor .nokta{background:var(--vurgu);animation:nabiz 1s ease-in-out infinite}
@keyframes nabiz{50%{opacity:.25}}

.btn{border:1px solid var(--cizgi);background:var(--bg);border-radius:8px;
  padding:8px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--soluk)}
.btn-ana{background:var(--vurgu);border-color:var(--vurgu);color:#fff;width:100%}
@media (prefers-color-scheme: dark){.btn-ana{color:#0E1520}}

h2{font-size:1rem;margin:28px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{display:flex;gap:10px}
h2 button{background:none;border:0;padding:0;color:var(--vurgu);cursor:pointer;font-size:.85rem;font-weight:500}

.kaynaklar{list-style:none;margin:0;padding:0}
.kaynaklar label{display:grid;grid-template-columns:auto 10px 1fr auto;gap:8px;
  align-items:center;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:.95rem}
.kaynaklar label:hover{background:var(--bg)}
.kaynaklar input{margin:0;accent-color:var(--vurgu)}
.renk{width:10px;height:10px;border-radius:2px}
.adet{color:var(--soluk);font-size:.85rem}
.kapali .ad{color:var(--soluk);text-decoration:line-through}
.okunamadi .adet{color:var(--hata)}

.secenek{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer;margin-top:10px}

/* --- Ana akış --- */
main{padding:28px clamp(16px,4vw,56px) 80px;max-width:900px}
.arama{width:100%;padding:12px 14px;border:1px solid var(--cizgi);border-radius:10px;
  background:var(--yuzey);font-size:1rem}
.arama::placeholder{color:var(--soluk)}
.ozet{color:var(--soluk);font-size:.9rem;margin:10px 2px 0}

.gun{font-size:.95rem;font-weight:700;color:var(--soluk);margin:32px 0 6px;
  padding-bottom:6px;border-bottom:1px solid var(--cizgi)}

.haber{display:grid;grid-template-columns:4.2rem 4px minmax(0,1fr);gap:0 14px;
  padding:12px 8px 12px 0;border-radius:8px;transition:background 1.2s}
.haber.yeni{background:var(--yeni)}
.saat{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;text-align:right;line-height:1.2}
.serit{border-radius:2px}
.icerik{min-width:0}
.kaynak-ad{font-size:.85rem;font-weight:600}
.baslik{display:block;font-size:1.08rem;font-weight:500;text-decoration:none;
  margin-top:1px;overflow-wrap:anywhere}
.baslik:hover{text-decoration:underline;text-underline-offset:3px}
.baslik:visited{color:var(--soluk)}

.bos{padding:60px 0;text-align:center;color:var(--soluk)}

.daha{display:block;margin:24px auto 0}

/* --- Mobil --- */
.menu-btn{display:none}
@media (max-width:820px){
  .duzen{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--cizgi);padding:18px 16px}
  aside .detay{display:none}
  aside.acik .detay{display:block}
  .ust{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .menu-btn{display:inline-block}
  .durum{margin-bottom:12px;min-height:0}
  .haber{grid-template-columns:3.4rem 3px minmax(0,1fr);gap:0 10px}
  .saat{font-size:1.1rem}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="duzen">
  <aside id="yan">
    <div class="ust">
      <p class="logo">Haber Paneli</p>
      <button class="btn menu-btn" id="menuBtn" aria-expanded="false">Kaynaklar</button>
    </div>
    <p class="durum" id="durum"><span class="nokta"></span>Bağlanıyor…</p>
    <div class="detay">
      <button class="btn btn-ana" id="taraBtn">Şimdi tara</button>

      <h2>Kaynaklar <span><button id="tumu">Tümü</button><button id="hicbiri">Hiçbiri</button></span></h2>
      <ul class="kaynaklar" id="kaynakListe"></ul>

      <h2>Ayarlar</h2>
      <label class="secenek"><input type="checkbox" id="bildirim"> Yeni haberde masaüstü bildirimi</label>
      <label class="secenek"><input type="checkbox" id="ses"> Yeni haberde ses çal</label>
    </div>
  </aside>

  <main>
    <input class="arama" id="arama" type="search" placeholder="Başlıklarda ara (ör. ekonomi, seçim)" aria-label="Başlıklarda ara">
    <p class="ozet" id="ozet"></p>
    <div id="akis"><p class="bos">İlk tarama yapılıyor, birkaç saniye içinde haberler gelecek.</p></div>
    <button class="btn daha" id="dahaBtn" hidden>Daha fazla göster</button>
  </main>
</div>

<script>
(() => {
  const SAYFA = 150;
  const SORGU_ARALIK = 15000;

  const durum = {
    haberler: new Map(),       // link -> haber
    kaynaklar: [],
    kapali: new Set(oku("kapali", [])),
    since: 0,
    ilkYukleme: true,
    yeniLinkler: new Set(),
    okunmamis: 0,
    gosterilecek: SAYFA,
    arama: "",
  };

  function oku(k, v){ try{ const x = localStorage.getItem("hp_"+k); return x ? JSON.parse(x) : v; }catch{ return v; } }
  function yaz(k, v){ try{ localStorage.setItem("hp_"+k, JSON.stringify(v)); }catch{} }

  const $ = id => document.getElementById(id);

  // Kaynaklara listedeki sıralarına göre ayırt edilebilir renkler
  const PALET = [0, 210, 130, 35, 280, 175, 330, 55, 245, 15, 100, 195, 305, 75, 225, 150];
  function renk(ad){
    let i = durum.kaynaklar.findIndex(k => k.ad === ad);
    if (i < 0){ i = 0; for (const c of ad) i = (i * 31 + c.charCodeAt(0)) >>> 0; }
    const tur = Math.floor(i / PALET.length);
    return `hsl(${PALET[i % PALET.length]} ${tur ? 45 : 68}% ${tur ? 40 : 47}%)`;
  }

  const saatFmt = new Intl.DateTimeFormat("tr-TR", {hour:"2-digit", minute:"2-digit"});
  const gunFmt  = new Intl.DateTimeFormat("tr-TR", {weekday:"long", day:"numeric", month:"long"});
  function gunEtiketi(d){
    const bugun = new Date(); bugun.setHours(0,0,0,0);
    const g = new Date(d); g.setHours(0,0,0,0);
    const fark = Math.round((bugun - g) / 864e5);
    if (fark === 0) return "Bugün";
    if (fark === 1) return "Dün";
    return gunFmt.format(d);
  }

  // ---------- Veri ----------
  async function getir(){
    try{
      const r = await fetch(`/api/haberler?since=${durum.since}`, {cache:"no-store"});
      if (!r.ok) throw new Error(r.status);
      const v = await r.json();
      durum.since = v.simdi;
      durum.kaynaklar = v.kaynaklar;

      const yeniler = [];
      for (const h of v.haberler){
        if (durum.haberler.has(h.link)) continue;
        durum.haberler.set(h.link, h);
        if (!durum.ilkYukleme && v.son_tarama) yeniler.push(h);
      }
      if (durum.ilkYukleme && v.son_tarama) durum.ilkYukleme = false;

      const gorunurYeniler = yeniler.filter(h => !durum.kapali.has(h.kaynak));
      gorunurYeniler.forEach(h => durum.yeniLinkler.add(h.link));
      if (gorunurYeniler.length) uyar(gorunurYeniler);

      durumYaz(v);
      kaynaklariCiz();
      akisiCiz();
    }catch(e){
      $("durum").innerHTML = `<span class="nokta" style="background:var(--hata)"></span>Sunucuya ulaşılamıyor. panel.py çalışıyor mu kontrol et.`;
    }
  }

  function durumYaz(v){
    const el = $("durum");
    el.classList.toggle("taraniyor", v.taraniyor || !v.son_tarama);
    if (!v.son_tarama){
      el.innerHTML = `<span class="nokta"></span>İlk tarama sürüyor…`;
      return;
    }
    const okunan = v.kaynaklar.filter(k => k.ok).length;
    const zaman = saatFmt.format(new Date(v.son_tarama * 1000));
    el.innerHTML = `<span class="nokta"></span>${v.taraniyor ? "Taranıyor…" : `Son tarama ${zaman}`}<br>${v.kaynaklar.length} kaynaktan ${okunan} tanesi okundu`;
  }

  // ---------- Çizim ----------
  function kaynaklariCiz(){
    const ul = $("kaynakListe");
    ul.replaceChildren(...durum.kaynaklar.map(k => {
      const li = document.createElement("li");
      const kapali = durum.kapali.has(k.ad);
      const lbl = document.createElement("label");
      lbl.className = (kapali ? "kapali " : "") + (k.ok === false ? "okunamadi" : "");
      lbl.title = k.ok === false ? "Bu kaynağın beslemesi okunamadı" : k.site;

      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !kapali;
      cb.addEventListener("change", () => {
        cb.checked ? durum.kapali.delete(k.ad) : durum.kapali.add(k.ad);
        yaz("kapali", [...durum.kapali]);
        kaynaklariCiz(); akisiCiz();
      });
      const r = document.createElement("span"); r.className = "renk"; r.style.background = renk(k.ad);
      const ad = document.createElement("span"); ad.className = "ad"; ad.textContent = k.ad;
      const adet = document.createElement("span"); adet.className = "adet";
      adet.textContent = k.ok === false ? "okunamadı" : (k.ok === null ? "…" : k.adet);
      lbl.append(cb, r, ad, adet); li.append(lbl);
      return li;
    }));
  }

  function filtreli(){
    const q = durum.arama.toLocaleLowerCase("tr");
    const terimler = q.split(",").map(s => s.trim()).filter(Boolean);
    return [...durum.haberler.values()]
      .filter(h => !durum.kapali.has(h.kaynak))
      .filter(h => !terimler.length || terimler.some(t => h.baslik.toLocaleLowerCase("tr").includes(t)))
      .sort((a, b) => b.zaman - a.zaman);
  }

  function akisiCiz(){
    const liste = filtreli();
    const akis = $("akis");
    const gosterilen = liste.slice(0, durum.gosterilecek);

    $("ozet").textContent = durum.haberler.size
      ? `${liste.length} haber gösteriliyor` + (durum.arama ? ` ("${durum.arama}" araması)` : "")
      : "";

    if (!gosterilen.length){
      akis.innerHTML = durum.haberler.size
        ? `<p class="bos">Bu seçimle eşleşen haber yok. Aramayı temizle ya da kaynak ekle.</p>`
        : `<p class="bos">İlk tarama yapılıyor, birkaç saniye içinde haberler gelecek.</p>`;
      $("dahaBtn").hidden = true;
      return;
    }

    const parcalar = [];
    let sonGun = null;
    for (const h of gosterilen){
      const d = new Date(h.zaman * 1000);
      const g = gunEtiketi(d);
      if (g !== sonGun){
        const b = document.createElement("h3"); b.className = "gun"; b.textContent = g;
        parcalar.push(b); sonGun = g;
      }
      const satir = document.createElement("article");
      satir.className = "haber" + (durum.yeniLinkler.has(h.link) ? " yeni" : "");
      satir.dataset.link = h.link;
      const s = document.createElement("time"); s.className = "saat";
      s.dateTime = d.toISOString(); s.textContent = saatFmt.format(d);
      const serit = document.createElement("span"); serit.className = "serit"; serit.style.background = renk(h.kaynak);
      const ic = document.createElement("div"); ic.className = "icerik";
      const k = document.createElement("span"); k.className = "kaynak-ad"; k.style.color = renk(h.kaynak); k.textContent = h.kaynak;
      const a = document.createElement("a"); a.className = "baslik"; a.href = h.link;
      a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = h.baslik || h.link;
      ic.append(k, a); satir.append(s, serit, ic);
      parcalar.push(satir);
    }
    akis.replaceChildren(...parcalar);
    $("dahaBtn").hidden = liste.length <= durum.gosterilecek;

    // Yeni vurgusunu bir süre sonra kaldır
    if (durum.yeniLinkler.size){
      const linkler = [...durum.yeniLinkler];
      setTimeout(() => {
        linkler.forEach(l => durum.yeniLinkler.delete(l));
        document.querySelectorAll(".haber.yeni").forEach(el => {
          if (linkler.includes(el.dataset.link)) el.classList.remove("yeni");
        });
      }, 90000);
    }
  }

  // ---------- Uyarılar ----------
  function uyar(yeniler){
    if (document.hidden){
      durum.okunmamis += yeniler.length;
      document.title = `(${durum.okunmamis}) Haber Paneli`;
    }
    if ($("ses").checked) bip();
    if ($("bildirim").checked && "Notification" in window && Notification.permission === "granted"){
      if (yeniler.length <= 3){
        yeniler.forEach(h => {
          const n = new Notification(h.kaynak, {body: h.baslik, tag: h.link});
          n.onclick = () => window.open(h.link, "_blank", "noopener");
        });
      } else {
        new Notification("Haber Paneli", {body: `${yeniler.length} yeni haber geldi`});
      }
    }
  }

  let ses;
  function bip(){
    try{
      ses = ses || new AudioContext();
      const o = ses.createOscillator(), g = ses.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.08, ses.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ses.currentTime + .25);
      o.connect(g).connect(ses.destination); o.start(); o.stop(ses.currentTime + .25);
    }catch{}
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden){ durum.okunmamis = 0; document.title = "Haber Paneli"; }
  });

  // ---------- Kontroller ----------
  let aramaZaman;
  $("arama").addEventListener("input", e => {
    clearTimeout(aramaZaman);
    aramaZaman = setTimeout(() => { durum.arama = e.target.value.trim(); durum.gosterilecek = SAYFA; akisiCiz(); }, 150);
  });
  $("dahaBtn").addEventListener("click", () => { durum.gosterilecek += SAYFA; akisiCiz(); });
  $("tumu").addEventListener("click", () => { durum.kapali.clear(); yaz("kapali", []); kaynaklariCiz(); akisiCiz(); });
  $("hicbiri").addEventListener("click", () => {
    durum.kaynaklar.forEach(k => durum.kapali.add(k.ad)); yaz("kapali", [...durum.kapali]);
    kaynaklariCiz(); akisiCiz();
  });
  $("taraBtn").addEventListener("click", async () => {
    const b = $("taraBtn"); b.disabled = true; b.textContent = "Taranıyor…";
    try{ await fetch("/api/tara", {method:"POST"}); }catch{}
    setTimeout(async () => { await getir(); b.disabled = false; b.textContent = "Şimdi tara"; }, 4000);
  });
  $("menuBtn").addEventListener("click", () => {
    const acik = $("yan").classList.toggle("acik");
    $("menuBtn").setAttribute("aria-expanded", acik);
  });

  const bildirimCb = $("bildirim"), sesCb = $("ses");
  bildirimCb.checked = oku("bildirim", false) && "Notification" in window && Notification.permission === "granted";
  sesCb.checked = oku("ses", false);
  bildirimCb.addEventListener("change", async () => {
    if (bildirimCb.checked && "Notification" in window && Notification.permission !== "granted"){
      const izin = await Notification.requestPermission();
      if (izin !== "granted") bildirimCb.checked = false;
    }
    yaz("bildirim", bildirimCb.checked);
  });
  sesCb.addEventListener("change", () => yaz("ses", sesCb.checked));

  getir();
  setInterval(getir, SORGU_ARALIK);
  setInterval(() => { if (durum.haberler.size) akisiCiz(); }, 60000); // "Bugün/Dün" etiketleri güncel kalsın
})();
</script>
</body>
</html>
